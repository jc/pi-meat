<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meat landing-page commit demos</title>
<style>
:root{color-scheme:dark;--bg:#090b0e;--panel:#11151a;--panel2:#171c22;--line:#29313a;--text:#e4eaf0;--muted:#929eaa;--red:#ff8f8f;--redbg:#2b1518;--green:#75df91;--greenbg:#10261a;--cyan:#75d9ef;--accent:#b1a8ff;--gold:#efc66e}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}body{font:14px/1.45 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100%;display:grid;grid-template-rows:auto auto auto minmax(430px,1fr)}header{padding:20px 24px 14px;background:radial-gradient(circle at 15% -30%,#292344 0,transparent 40%),linear-gradient(135deg,#11151a,#0b0e12);border-bottom:1px solid var(--line)}h1{font-size:24px;margin:0 0 5px;letter-spacing:-.03em}header p{margin:0;color:var(--muted);max-width:980px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 24px;background:#0d1014;border-bottom:1px solid var(--line)}button.card{color:inherit;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}.card.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.card .lang{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.card strong{display:block;font-size:25px;margin:2px 0}.card small{color:var(--muted)}.intro{display:grid;grid-template-columns:minmax(260px,1.5fr) repeat(4,minmax(120px,.55fr));gap:10px;padding:12px 24px;border-bottom:1px solid var(--line)}.box{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px}.box h2{font-size:16px;margin:0 0 4px}.box p{margin:0;color:var(--muted)}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:19px}.metric .good{color:var(--green)}main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px}.viewer{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)}.toolbar{display:flex;gap:13px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#0e1216;border-bottom:1px solid var(--line);color:var(--muted)}.toolbar label{display:inline-flex;align-items:center;gap:6px}.panes{min-height:0;display:grid;grid-template-columns:1fr 1fr}.pane{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);border-right:1px solid var(--line)}.pane:last-child{border-right:0}.pane-title{padding:7px 11px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.pane-title span{color:var(--muted)}.code{overflow:auto;padding:7px 0 18px;background:#0a0d11;font:12px/1.52 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:4}.code.wrap .txt{white-space:pre-wrap;overflow-wrap:anywhere}.line{display:grid;grid-template-columns:46px minmax(0,1fr);min-height:18px}.ln{position:sticky;left:0;z-index:1;text-align:right;padding-right:8px;color:#596573;background:inherit;border-right:1px solid rgba(255,255,255,.04);user-select:none}.txt{min-width:0;white-space:pre;padding:0 9px}.add{background:var(--greenbg);color:var(--green)}.del{background:var(--redbg);color:var(--red)}.hunk{background:#101d23;color:var(--cyan)}.meta{background:#12171d;color:#b8c2cc}.ellipsis{background:#28210f;color:var(--gold);font-weight:700}aside{overflow:auto;min-height:0;padding:16px;background:var(--panel);border-left:1px solid var(--line)}aside h3{margin:0 0 8px;font-size:14px}aside h3:not(:first-child){margin-top:18px}aside p{color:#c5ced7}.quote{padding:10px 12px;border-left:3px solid var(--accent);background:#171426;font-size:16px}.why{padding-left:18px}.why li{margin:6px 0;color:#cbd3dc}code{font:.92em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#d4ceff}.pill{display:inline-block;border:1px solid #3c355a;background:#241f37;color:#c9c2ff;border-radius:999px;padding:2px 7px;font-size:11px}@media(max-width:1050px){.cards{grid-template-columns:1fr}.intro{grid-template-columns:repeat(2,1fr)}.intro .summary{grid-column:1/-1}main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line);max-height:350px}}@media(max-width:720px){.panes{grid-template-columns:1fr}.pane{min-height:390px;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="shell">
<header><h1>Three commits that show Meat at its best</h1><p>Each real commit changes fewer than 25 source rows. Meat keeps exactly one old/new pair—the conceptual change—and removes repeated hunks, imports, and generated copies.</p></header>
<nav class="cards" id="cards"></nav>
<section class="intro" id="intro"></section>
<main>
<section class="viewer">
<div class="toolbar"><label><input id="sync" type="checkbox" checked> sync scrolling</label><label><input id="wrap" type="checkbox"> wrap lines</label><span class="pill">green added</span><span class="pill">red removed</span><span class="pill">cyan hunk</span></div>
<div class="panes">
<section class="pane"><div class="pane-title"><b>Original commit diff</b><span id="leftStats"></span></div><div class="code" id="left"></div></section>
<section class="pane"><div class="pane-title"><b>What Meat shows</b><span id="rightStats"></span></div><div class="code" id="right"></div></section>
</div>
</section>
<aside id="detail"></aside>
</main>
</div>
<script src="data.js"></script>
<script>
const demos={
 go:{lang:"Go",project:"Go standard library",sha:"0b6ea6bb04e4",title:"Eight error paths. One correction.",subject:'net: return "cannot unmarshal" error while parsing DNS messages',raw:{changed:16,rows:76,bytes:2895,files:1,hunks:8},out:{changed:2,rows:10,bytes:458,files:1,hunks:1},files:{raw:"go-original.diff",out:"go-meat.diff"},summary:"Use the canonical DNS unmarshal error text consistently when response parsing fails across host and PTR lookups.",copy:"Meat turns 16 changed lines across 8 hunks into the only 2 lines you need.",why:["The same incorrect DNS error appears in eight parsing branches.","One representative old/new pair fully communicates the fix.","No domain knowledge is required: marshal and unmarshal are visibly different."],stability:"2/16 changed rows in all four recorded runs across two Meat revisions."},
 python:{lang:"Python",project:"Hugging Face Transformers",sha:"cb0adddc36827",title:"Nine files changed. One file worth reading.",subject:"fix(DSV3): parity between native DeepseekV3MoE and remote official implementation",raw:{changed:18,rows:117,bytes:7812,files:9,hunks:9},out:{changed:2,rows:11,bytes:774,files:1,hunks:1},files:{raw:"python-original.diff",out:"python-meat.diff"},summary:"Exclude masked experts from MoE top-k routing by assigning them negative infinity, with dependent model files regenerated.",copy:"Meat keeps the modular source fix and removes eight generated copies.",why:["Using 0.0 can let a masked expert beat negative unmasked scores.","The modular source changes to negative infinity, making selection impossible.","Eight generated modeling files repeat the exact source-of-truth edit."],stability:"2/18 changed rows in all four recorded runs across two Meat revisions."},
 rust:{lang:"Rust",project:"Helix editor",sha:"e7874bc69c05",title:"Eleven hunks. One concurrency choice.",subject:"chore(helix-term): LSP unordered fanout requests",raw:{changed:22,rows:106,bytes:5090,files:3,hunks:11},out:{changed:2,rows:13,bytes:546,files:1,hunks:1},files:{raw:"rust-original.diff",out:"rust-meat.diff"},summary:"Process LSP requests as they complete with FuturesUnordered across commands and document color/link handlers.",copy:"Meat shows that LSP responses are now handled as they complete—and nothing else.",why:["Eight LSP fan-out sites make the same ordered-to-unordered switch.","Import substitutions are hidden automatically.","One surviving pair captures the latency-relevant concurrency decision."],stability:"2/22 changed rows in three runs and 4/22 in one, across two Meat revisions."}
};
const files=window.__FILES__||window.__DEMO_FILES__||{};let current="go";const $=s=>document.querySelector(s);const pct=(a,b)=>(100*a/b).toFixed(1)+"%";const fmt=n=>n.toLocaleString("en-US");
function kind(s){if(s.length>1&&s.slice(1).trim()==="...")return"ellipsis";if(s.startsWith("diff --git")||s.startsWith("index ")||s.startsWith("--- ")||s.startsWith("+++ "))return"meta";if(s.startsWith("@@"))return"hunk";if(s.startsWith("+")&&!s.startsWith("+++"))return"add";if(s.startsWith("-")&&!s.startsWith("---"))return"del";return"ctx"}
function diff(node,text){node.replaceChildren();const f=document.createDocumentFragment();text.replace(/\n$/,"").split("\n").forEach((s,i)=>{const row=document.createElement("div");row.className="line "+kind(s);const n=document.createElement("span");n.className="ln";n.textContent=i+1;const t=document.createElement("span");t.className="txt";t.textContent=s||" ";row.append(n,t);f.append(row)});node.append(f);node.scrollTop=0;node.scrollLeft=0}
function cards(){$("#cards").innerHTML=Object.entries(demos).map(([k,d])=>`<button class="card ${k===current?'active':''}" data-k="${k}"><span class="lang">${d.lang} · ${d.project}</span><strong>${d.raw.changed} → ${d.out.changed}</strong><small>${d.title}</small></button>`).join("");document.querySelectorAll(".card").forEach(b=>b.onclick=()=>{current=b.dataset.k;render()})}
function metric(label,value,sub,good=false){return`<div class="box metric"><span>${label}</span><strong class="${good?'good':''}">${value}</strong><span>${sub}</span></div>`}
function render(){const d=demos[current];cards();$("#intro").innerHTML=`<div class="box summary"><h2>${d.project} · <code>${d.sha}</code></h2><p>${d.subject}</p></div>`+metric("Changed rows",`${d.raw.changed} → ${d.out.changed}`,`${pct(d.raw.changed-d.out.changed,d.raw.changed)} elided`,true)+metric("Hunks",`${d.raw.hunks} → ${d.out.hunks}`,"repeated locations removed")+metric("Files",`${d.raw.files} → ${d.out.files}`,"only relevant files remain")+metric("Bytes",`${fmt(d.raw.bytes)} → ${fmt(d.out.bytes)}`,`${pct(d.raw.bytes-d.out.bytes,d.raw.bytes)} smaller`);diff($("#left"),files[d.files.raw]||"");diff($("#right"),files[d.files.out]||"");$("#leftStats").textContent=`${d.raw.changed} changed · ${d.raw.rows} rows`;$("#rightStats").textContent=`${d.out.changed} changed · ${d.out.rows} rows`;$("#detail").innerHTML=`<h3>Landing-page line</h3><div class="quote"><b>${d.title}</b><br>${d.copy}</div><h3>Meat summary</h3><p>${d.summary}</p><h3>Why this demo works</h3><ul class="why">${d.why.map(x=>`<li>${x}</li>`).join("")}</ul><h3>Evaluation history</h3><p>${d.stability}</p>`}
let locking=false;function sync(a,b){if(!$("#sync").checked||locking)return;locking=true;const ma=a.scrollHeight-a.clientHeight,mb=b.scrollHeight-b.clientHeight;b.scrollTop=ma? a.scrollTop/ma*mb:0;b.scrollLeft=a.scrollLeft;requestAnimationFrame(()=>locking=false)}$("#left").addEventListener("scroll",()=>sync($("#left"),$("#right")));$("#right").addEventListener("scroll",()=>sync($("#right"),$("#left")));$("#wrap").onchange=e=>document.querySelectorAll(".code").forEach(n=>n.classList.toggle("wrap",e.target.checked));render();
</script>
</body>
</html>
